<!doctype html>
<html>
  <body style="margin:0;background:#f4f4f5;font:12px Inter,system-ui,sans-serif;color:#3f3f46">
    <div
      id="grid"
      style="display:grid;grid-template-columns:repeat(8,1fr);gap:8px;padding:14px"
    ></div>
    <div id="err" style="color:#dc2626;padding:16px;white-space:pre-wrap"></div>
    <script type="module">
      const err = document.getElementById('err')
      try {
        const { MOODS } = await import('/src/moods/index.ts')
        const { generateBlobSvg } = await import('/src/core/generateBlob.ts')
        const grid = document.getElementById('grid')
        // A neutral mid colour so white eyes and dark eyes both show; render the
        // face only (no shape) so nothing but the eyes is being judged.
        for (const m of MOODS) {
          const cell = document.createElement('div')
          cell.style.cssText =
            'background:#fff;border:1px solid #e4e4e7;border-radius:14px;padding:6px;text-align:center'
          const svg = generateBlobSvg(
            { shape: 'circle', mood: m.id, color: '#6366f1' },
            { size: 150 },
          )
          cell.innerHTML =
            svg + `<div style="margin-top:2px;font-weight:600">${m.label}</div>`
          grid.appendChild(cell)
        }
        document.title = 'ready:' + MOODS.length
      } catch (e) {
        err.textContent = 'ERROR: ' + (e && (e.stack || e.message))
        document.title = 'error'
      }
    </script>
  </body>
</html>
