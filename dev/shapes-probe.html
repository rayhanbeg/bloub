<!doctype html>
<html>
  <body style="margin:0;background:#f4f4f5;font:12px Inter,system-ui,sans-serif;color:#3f3f46">
    <div id="grid" style="padding:12px"></div>
    <div id="err" style="color:#dc2626;padding:16px;white-space:pre-wrap"></div>
    <script type="module">
      const err = document.getElementById('err')
      try {
        const { SHAPES } = await import('/src/shapes/index.ts')
        const { generateBlobSvg } = await import('/src/core/generateBlob.ts')
        const grid = document.getElementById('grid')
        // The moods that push hardest against the body edges: tallest eyes,
        // highest brows, lowest lids, and the two garnish moods.
        const moods = ['neutral', 'amazed', 'frustrated', 'sleepy', 'sad', 'scared', 'daydreaming']
        for (const s of SHAPES) {
          const row = document.createElement('div')
          row.style.cssText = 'display:flex;gap:8px;align-items:center;margin-bottom:6px'
          row.innerHTML =
            `<div style="width:64px;font-weight:600">${s.label}</div>` +
            moods
              .map(
                (m) =>
                  `<div style="background:#fff;border:1px solid #e4e4e7;border-radius:12px">` +
                  generateBlobSvg({ shape: s.id, mood: m, color: '#6366f1' }, { size: 124 }) +
                  `</div>`,
              )
              .join('')
          grid.appendChild(row)
        }
        document.title = 'ready:' + SHAPES.length
      } catch (e) {
        err.textContent = 'ERROR: ' + (e && (e.stack || e.message))
        document.title = 'error'
      }
    </script>
  </body>
</html>
